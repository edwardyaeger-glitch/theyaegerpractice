name: Update Substack posts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-substack-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v5

      - name: Refresh posts from Substack
        run: python3 scripts/update_substack_posts.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- musing.html; then
            echo "No new Substack posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musing.html
          git commit -m "Refresh Substack posts"
          git push
